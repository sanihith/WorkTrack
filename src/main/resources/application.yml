server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
    username: kba_user
    password: sanihith
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  security:
    oauth2:
      client:
        registration:
          azure:
            client-id: YOUR_AZURE_CLIENT_ID
            client-secret: YOUR_AZURE_CLIENT_SECRET
            authorization-grant-type: authorization_code
            scope: openid,profile,email,User.Read
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          azure:
            authorization-uri: https://login.microsoftonline.com/organizations/oauth2/v2.0/authorize
            token-uri: https://login.microsoftonline.com/organizations/oauth2/v2.0/token
            user-info-uri: https://graph.microsoft.com/oidc/userinfo
            user-name-attribute: email
  mail:
    host: localhost
    port: 25
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  jwt:
    secret: TaskPortalSecretKeyForJWTSigningMustBeAtLeast256BitsLongForHMACSHA256Algorithm
    expiration: 86400000
  cors:
    allowed-origins: http://localhost:5173

file:
  upload:
    dir: ./uploads